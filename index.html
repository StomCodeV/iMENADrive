<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Imena Drive – Duolingo Style</title>
  <!-- Tailwind via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <style>
    /* ----- RESET & GLOBAL ----- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #0b1120;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    /* Animated Background Orbs */
    body::before, body::after {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.15;
      animation: floatOrb 12s infinite alternate ease-in-out;
      z-index: 0;
    }
    body::before { background: #F59E0B; top: -10%; left: -15%; }
    body::after { background: #3b82f6; bottom: -10%; right: -15%; animation-delay: 4s; }
    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(60px, 40px) scale(1.2); }
    }
    #particles-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    #app {
      width: 100%;
      max-width: 480px;
      min-height: 95vh;
      max-height: 95vh;
      background: rgba(11, 17, 32, 0.8);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 2.5rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 40px rgba(245, 158, 11, 0.08), 0 0 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255,255,255,0.05);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: transform 0.1s ease;
      transform-style: preserve-3d;
      perspective: 800px;
      z-index: 10;
    }
    /* 3D tilt applied via JS */
    @media (min-width: 640px) {
      body { padding: 1rem; }
      #app { max-width: 520px; min-height: 90vh; border-radius: 2.5rem; }
    }
    /* Glowing Border accent */
    #app::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 2.5rem;
      padding: 2px;
      background: conic-gradient(from 180deg at 50% 50%, #F59E0B, transparent 30%, #3b82f6 60%, #F59E0B);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      opacity: 0.3;
      z-index: 0;
    }
    .glass {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 1.25rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }
    .glass-hover:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(245, 158, 11, 0.3); transform: translateY(-2px); transition: all 0.2s; }
    .page {
      display: none;
      flex: 1;
      padding: 1rem 1rem 5.5rem 1rem;
      overflow-y: auto;
      animation: slideUp 0.3s ease;
      position: relative;
      z-index: 5;
    }
    .page.active { display: block; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    
    /* BOTTOM NAV */
    .bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(11, 17, 32, 0.95);
      backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      justify-content: space-around;
      padding: 0.3rem 0 0.6rem 0;
      border-radius: 0 0 2.5rem 2.5rem;
      z-index: 50;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.55rem;
      color: #64748b;
      cursor: pointer;
      background: none;
      border: none;
      gap: 1px;
      padding: 0.2rem 0.5rem;
      border-radius: 0.75rem;
      transition: 0.2s;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .nav-item.active { color: #F59E0B; }
    .nav-item svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 1.8; fill: none; }
    .nav-item.active svg { stroke: #F59E0B; }

    /* TOP BAR */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      background: rgba(11,17,32,0.5);
      z-index: 10;
      flex-shrink: 0;
    }
    .xp-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.05);
      padding: 0.15rem 0.6rem 0.15rem 0.4rem;
      border-radius: 2rem;
      font-size: 0.7rem;
      font-weight: 700;
      color: #fbbf24;
    }
    .heart-icon { color: #ef4444; font-size: 1rem; line-height: 1; }
    .streak-icon { color: #f97316; }

    /* AUTH */
    .auth-tab { padding: 0.4rem 1.2rem; border-radius: 2rem; font-weight: 700; cursor: pointer; background: transparent; color: #94a3b8; border: none; font-size: 0.85rem; transition: 0.2s; }
    .auth-tab.active { background: #F59E0B; color: #0F172A; }

    /* PATH / MAP */
    .path-connector { position: relative; padding-left: 1.5rem; }
    .path-connector::before {
      content: '';
      position: absolute;
      left: 18px;
      top: 28px;
      bottom: 28px;
      width: 3px;
      background: linear-gradient(to bottom, #F59E0B, #3b82f6, #F59E0B);
      opacity: 0.2;
      border-radius: 10px;
    }
    .path-node { position: relative; }
    .path-node::before {
      content: '';
      position: absolute;
      left: -1.5rem;
      top: 0.5rem;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #334155;
      border: 2px solid #475569;
      transition: 0.3s;
    }
    .path-node.completed::before { background: #F59E0B; border-color: #F59E0B; box-shadow: 0 0 20px rgba(245,158,11,0.4); }
    .path-node.current::before { background: #3b82f6; border-color: #60a5fa; box-shadow: 0 0 20px rgba(59,130,246,0.4); animation: pulse-dot 1.5s infinite; }
    @keyframes pulse-dot { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }

    .level-badge { font-size: 0.6rem; font-weight: 800; text-transform: uppercase; padding: 0.1rem 0.6rem; border-radius: 2rem; letter-spacing: 0.05em; }
    .level-beginner { background: rgba(34,197,94,0.2); color: #4ade80; }
    .level-intermediate { background: rgba(251,191,36,0.2); color: #facc15; }
    .level-advanced { background: rgba(248,113,113,0.2); color: #f87171; }

    /* QUIZ */
    .quiz-option { padding: 0.7rem 1rem; border-radius: 1rem; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); cursor: pointer; transition: 0.15s; margin-bottom: 0.4rem; font-size: 0.9rem; }
    .quiz-option:hover { background: rgba(255,255,255,0.07); }
    .quiz-option.selected { border-color: #F59E0B; background: rgba(245,158,11,0.12); }
    .quiz-option.correct { border-color: #22c55e; background: rgba(34,197,94,0.15); }
    .quiz-option.wrong { border-color: #ef4444; background: rgba(239,68,68,0.15); }

    /* SCROLLBAR */
    ::-webkit-scrollbar { width: 2px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #F59E0B; border-radius: 10px; }

    /* Confetti Canvas */
    #confetti-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999; }
  </style>
</head>

<div id="app">

        <span data-i18n="profile">Profile</span>

    </div>
  </div>
</div>

  let currentUser = null;

  // ================================================================
  // AUTH
  // ================================================================
  function switchAuthTab(tab) {
    document.querySelectorAll('.auth-tab').forEach(el => el.classList.remove('active'));
    document.querySelector(`.auth-tab[data-tab="${tab}"]`).classList.add('active');
    document.getElementById('login-form').classList.toggle('hidden', tab !== 'login');
    document.getElementById('register-form').classList.toggle('hidden', tab !== 'register');
  }
  async function handleLogin(e) { e.preventDefault(); try { await auth.signInWithEmailAndPassword(document.getElementById('login-email').value, document.getElementById('login-password').value); } catch(err) { showErr('auth-error', err.message); } }
  async function handleRegister(e) { e.preventDefault(); try { const cred = await auth.createUserWithEmailAndPassword(document.getElementById('reg-email').value, document.getElementById('reg-password').value); await cred.user.updateProfile({ displayName: document.getElementById('reg-name').value }); } catch(err) { showErr('reg-error', err.message); } }

  function showErr(id, msg) { const el = document.getElementById(id); el.textContent = msg; el.classList.remove('hidden'); setTimeout(() => el.classList.add('hidden'), 4000); }
  function handleLogout() { auth.signOut(); }

  auth.onAuthStateChanged(async (user) => {
    if (user) {
      currentUser = user;
      document.getElementById('auth-page').style.display = 'none';
      document.getElementById('main-app').style.display = 'flex';
      await loadProgress();
      renderAll();
      fetchLeaderboard();
    } else {
      currentUser = null;
      document.getElementById('auth-page').style.display = 'flex';
      document.getElementById('main-app').style.display = 'none';
    }
  });

  // ================================================================
  // PROGRESS (Firestore + Local)
  // ================================================================
  async function loadProgress() {
    try {
      const doc = await db.collection('users').doc(currentUser.uid).get();
      if (doc.exists) {
        const data = doc.data();
        userProgress = data.progress || { xp: 0, hearts: 5, streak: 0, dailyXpEarned: 0, lastActivityDate: null, completedLessons: [], quizScore: 0, lastLesson: null };
      } else {
        await db.collection('users').doc(currentUser.uid).set({ name: currentUser.displayName || 'Driver', email: currentUser.email, xp: 0, progress: userProgress });
      }
    } catch (e) {
      const saved = localStorage.getItem('imena_progress');
      if (saved) userProgress = JSON.parse(saved);
    }
    // Daily reset
    const today = new Date().toDateString();
    if (userProgress.lastActivityDate !== today) {
      userProgress.dailyXpEarned = 0;
      // Regenerate hearts (1 per 10min, cap 5)
      if (userProgress.hearts < 5) userProgress.hearts = Math.min(5, userProgress.hearts + 1);
      userProgress.lastActivityDate = today;
      await saveProgress();
    }
  }

  async function saveProgress() {
    if (!currentUser) return;
    try {
      await db.collection('users').doc(currentUser.uid).set({ progress: userProgress, xp: userProgress.xp }, { merge: true });
    } catch (e) {
      localStorage.setItem('imena_progress', JSON.stringify(userProgress));
    }
  }

  function addXP(amount) {
    userProgress.xp += amount;
    userProgress.dailyXpEarned += amount;
    const today = new Date().toDateString();
    if (userProgress.lastActivityDate !== today) {
      userProgress.dailyXpEarned = amount;
      userProgress.lastActivityDate = today;
    }
    // Streak: if daily goal >= 20, increment
    if (userProgress.dailyXpEarned >= 20) {
      // Check if streak already incremented today (using a simple flag or check last streak date)
      // We'll just increment once per day when goal reached. We'll track in save.
    }
    saveProgress();
    updateUI();
  }

  function loseHeart() {
    if (userProgress.hearts > 0) userProgress.hearts--;
    saveProgress();
    updateUI();
    return userProgress.hearts;
  }

  // ================================================================
  // NAVIGATION
  // ================================================================
  function navigateTo(page) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(`${page}-page`).classList.add('active');
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.querySelector(`.nav-item[data-page="${page}"]`)?.classList.add('active');
    if (page === 'leaderboard') fetchLeaderboard();
    if (page === 'profile') renderProfile();
    if (page === 'dashboard') renderPath();
  }

  // ================================================================
  // RENDER: PATH (HOME)
  // ================================================================
  function renderPath() {
    const container = document.getElementById('path-container');
    let html = '';
    const totalLessons = ALL_LESSON_IDS.length;
    const doneCount = userProgress.completedLessons.filter(id => ALL_LESSON_IDS.includes(id)).length;
    const overallPct = Math.round((doneCount / totalLessons) * 100);

    LEVELS.forEach((level, lIdx) => {
      const lessons = LESSONS_BY_LEVEL[level.id] || [];
      const doneHere = lessons.filter(l => userProgress.completedLessons.includes(l.id)).length;
      const pct = lessons.length > 0 ? Math.round((doneHere / lessons.length) * 100) : 0;
      const isComplete = pct === 100;
      const isCurrent = pct > 0 && pct < 100;
      const nodeClass = isComplete ? 'completed' : (isCurrent ? 'current' : '');

      html += `<div class="path-node ${nodeClass} glass p-4 rounded-xl" style="border-color: ${isComplete ? 'rgba(245,158,11,0.4)' : 'rgba(255,255,255,0.05)'};">`;
      html += `<div class="flex items-center gap-3 mb-2"><span class="text-xl">${level.icon}</span><span class="font-bold text-sm"><span class="level-badge ${level.badge}">${t(level.titleKey)}</span></span><span class="text-xs text-slate-400 ml-auto">${doneHere}/${lessons.length}</span></div>`;
      html += `<div class="space-y-2 ml-1">`;
      lessons.forEach(lesson => {
        const done = userProgress.completedLessons.includes(lesson.id);
        html += `<div class="flex items-center gap-3 cursor-pointer glass-hover p-2 rounded-lg transition" onclick="completeLesson('${lesson.id}')" style="background: ${done ? 'rgba(245,158,11,0.05)' : 'transparent'}; border-left: 2px solid ${done ? '#F59E0B' : 'transparent'};">`;
        html += `<span class="text-lg">${lesson.icon}</span><span class="flex-1 text-sm font-medium">${t(lesson.titleKey)}</span>`;
        html += `<span class="text-xs ${done ? 'text-green-400' : 'text-slate-500'}">${done ? '✅ +10XP' : '⏳'}</span>`;
        html += `</div>`;
      });
      html += `</div></div>`;
      // Connector line between levels
      if (lIdx < LEVELS.length - 1) {
        html += `<div class="h-6 flex items-center justify-center"><span class="text-slate-600 text-[0.5rem]">⬇️</span></div>`;
      }
    });

    html += `<div class="mt-4 text-center text-xs text-slate-400">Progress: ${overallPct}% • ${doneCount}/${totalLessons} lessons</div>`;
    container.innerHTML = html;
    updateUI();
  }

  // ================================================================
  // COMPLETE LESSON (Duolingo Style)
  // ================================================================
  function completeLesson(id) {
    if (userProgress.completedLessons.includes(id)) {
      // Already done, maybe show a message
      return;
    }
    userProgress.completedLessons.push(id);
    userProgress.lastLesson = id;
    addXP(10);
    // Check daily goal
    if (userProgress.dailyXpEarned >= 20) {
      userProgress.streak = (userProgress.streak || 0) + 1;
      saveProgress();
      // Show confetti
      fireConfetti();
      alert('🎉 Daily Goal reached! +1 Streak!');
    } else {
      // Show mini confetti
      fireConfetti(50);
    }
    saveProgress();
    renderPath();
    updateUI();
  }

  // ================================================================
  // RENDER: LEADERBOARD
  // ================================================================
  async function fetchLeaderboard() {
    const container = document.getElementById('leaderboard-list');
    container.innerHTML = '<div class="text-center text-slate-500 text-xs">Loading champions...</div>';
    try {
      const snapshot = await db.collection('users').orderBy('xp', 'desc').limit(10).get();
      let rank = 1;
      let html = '';
      snapshot.forEach(doc => {
        const data = doc.data();
        const name = data.name || 'Driver';
        const xp = data.xp || 0;
        const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : `#${rank}`;
        const isMe = doc.id === currentUser?.uid;
        html += `<div class="glass p-3 rounded-xl flex items-center gap-3 ${isMe ? 'border-amber-500/40' : ''}" style="border-color: ${isMe ? 'rgba(245,158,11,0.3)' : 'rgba(255,255,255,0.05)'};">`;
        html += `<span class="w-8 text-center text-sm font-bold text-slate-400">${medal}</span>`;
        html += `<span class="flex-1 text-sm font-medium">${name} ${isMe ? '(You)' : ''}</span>`;
        html += `<span class="text-xs text-amber-400 font-bold">⭐ ${xp} XP</span>`;
        html += `</div>`;
        rank++;
      });
      container.innerHTML = html || '<p class="text-slate-500 text-xs">No users yet. Be the first!</p>';
    } catch (e) {
      container.innerHTML = '<p class="text-slate-500 text-xs">Leaderboard offline. Practice more!</p>';
    }
  }

  // ================================================================
  // 3D TILT EFFECT
  // ================================================================
  const appEl = document.getElementById('app');
  document.addEventListener('mousemove', (e) => {
    if (!appEl) return;
    const rect = appEl.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width - 0.5;
    const y = (e.clientY - rect.top) / rect.height - 0.5;
    appEl.style.transform = `rotateY(${x * 4}deg) rotateX(${-y * 4}deg)`;
  });
  document.addEventListener('mouseleave', () => {
    appEl.style.transform = `rotateY(0deg) rotateX(0deg)`;
  });

  // ================================================================
  // PARTICLES BACKGROUND
  // ================================================================
  const pCanvas = document.getElementById('particles-canvas');
  const pCtx = pCanvas.getContext('2d');
  let particles = [];
  function resizeParticles() {
    pCanvas.width = window.innerWidth;
    pCanvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeParticles);
  resizeParticles();
  for (let i = 0; i < 40; i++) {
    particles.push({ x: Math.random() * pCanvas.width, y: Math.random() * pCanvas.height, r: Math.random() * 2 + 1, dx: (Math.random() - 0.5) * 0.3, dy: (Math.random() - 0.5) * 0.3, color: Math.random() > 0.5 ? 'rgba(245,158,11,0.15)' : 'rgba(59,130,246,0.15)' });
  }
  function drawParticles() {
    pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
    particles.forEach(p => {
      p.x += p.dx; p.y += p.dy;
      if (p.x < 0 || p.x > pCanvas.width) p.dx *= -1;
      if (p.y < 0 || p.y > pCanvas.height) p.dy *= -1;
      pCtx.beginPath();
      pCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      pCtx.fillStyle = p.color;
      pCtx.fill();
    });
    requestAnimationFrame(drawParticles);
  }
  drawParticles();

  // ================================================================
  // CONFETTI CANVAS
  // ================================================================
  const cCanvas = document.getElementById('confetti-canvas');
  const cCtx = cCanvas.getContext('2d');
  let confettiPieces = [];
  function resizeConfetti() {
    cCanvas.width = window.innerWidth;
    cCanvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeConfetti);
  resizeConfetti();

  function fireConfetti(count = 120) {
    for (let i = 0; i < count; i++) {
      confettiPieces.push({
        x: Math.random() * cCanvas.width,
        y: Math.random() * cCanvas.height - cCanvas.height,
        w: Math.random() * 6 + 3,
        h: Math.random() * 6 + 3,
        color: ['#F59E0B', '#3b82f6', '#22c55e', '#ef4444', '#8b5cf6'][Math.floor(Math.random() * 5)],
        dx: (Math.random() - 0.5) * 6,
        dy: Math.random() * 8 + 2,
        life: 1
      });
    }
    if (!window._confettiAnim) {
      window._confettiAnim = true;
      animateConfetti();
    }
  }

  function animateConfetti() {
    cCtx.clearRect(0, 0, cCanvas.width, cCanvas.height);
    let alive = false;
    confettiPieces.forEach(p => {
      p.x += p.dx;
      p.y += p.dy;
      p.dy += 0.05;
      p.life -= 0.002;
      if (p.life > 0) { alive = true;
        cCtx.save();
        cCtx.translate(p.x, p.y);
        cCtx.rotate(p.dx * 0.1);
        cCtx.fillStyle = p.color;
        cCtx.globalAlpha = p.life;
        cCtx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
        cCtx.restore(); }
    });
    confettiPieces = confettiPieces.filter(p => p.life > 0);
    if (alive) requestAnimationFrame(animateConfetti);
    else { window._confettiAnim = false; cCtx.clearRect(0, 0, cCanvas.width, cCanvas.height); }
  }
